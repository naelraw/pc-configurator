# PC Radar — réglages de performance et de protection (niveau http)

# Compression des textes (le catalogue /api/components arrive déjà compressé).
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml image/svg+xml application/manifest+json;

# Garde en mémoire les métadonnées des fichiers statiques.
open_file_cache max=2000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_errors on;

# Cache des réponses publiques de l'application. Si l'application est lente
# ou tombe, nginx continue de servir la dernière version connue.
proxy_cache_path /var/cache/nginx/pcradar levels=1:2 keys_zone=pcradar:20m
                 max_size=2g inactive=7d use_temp_path=off;

# Une seule variante compressée/non compressée par ressource dans le cache.
map $http_accept_encoding $pcradar_gzip {
    ~*gzip  gzip;
    default "";
}

# Limites par adresse IP (réponse 429 au-delà) : un visiteur normal n'en
# approche jamais, un script qui martèle le site est freiné.
# Le serveur lui-même (tests de charge, surveillance) n'est pas limité :
# une clé vide n'est comptée par aucune zone.
geo $pcradar_exempt {
    default     0;
    127.0.0.1   1;
    10.0.0.79   1;
    88.96.49.31 1;
}
map $pcradar_exempt $pcradar_limit_key {
    1       "";
    default $binary_remote_addr;
}

limit_req_zone  $pcradar_limit_key zone=pcradar_lim_api:20m   rate=30r/s;
limit_req_zone  $pcradar_limit_key zone=pcradar_lim_ia:10m    rate=6r/m;
limit_req_zone  $pcradar_limit_key zone=pcradar_lim_auth:10m  rate=10r/m;
limit_conn_zone $pcradar_limit_key zone=pcradar_lim_conn:10m;
limit_req_status  429;
limit_conn_status 429;

upstream pcradar_app {
    server 127.0.0.1:8000;
    keepalive 64;
}
