# PC Radar — surcharge de performance (le fichier de service d'origine est inchangé)
[Service]
ExecStart=
# 3 processus pour 2 cœurs (le travail attend souvent la base ou le réseau),
# uvloop/httptools : boucle et analyse HTTP en C, plus rapides.
# Pas de journal d'accès ici : nginx le tient déjà, et écrire chaque requête
# dans le journal système coûte du processeur sous forte charge.
ExecStart=/home/ubuntu/pc-configurator/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000 --workers 3 --loop uvloop --http httptools --backlog 2048 --timeout-keep-alive 20 --no-access-log
LimitNOFILE=65536
TimeoutStopSec=20
