<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PC Radar</title>
<style>
  /* Même système visuel que le site (DESIGN.md) : anthracite, accent émeraude unique. */
  :root{
    --bg:#0e0f11; --surface:#141517; --surface-2:#1a1b1e; --surface-3:#222327;
    --line:#26272b; --line-strong:#35363c;
    --text:#ececee; --text-2:#a3a3ab; --text-3:#81828a;
    --accent:#3ecf8e; --accent-hover:#5fdba3; --accent-soft:rgba(62,207,142,0.1); --accent-line:rgba(62,207,142,0.38);
    --ink:#05140d; --danger:#f07171;
    --font:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; }
  body{ width:320px; margin:0; padding:0; font-family:var(--font); font-size:13px; line-height:1.5; background:var(--surface); color:var(--text); }
  header{ display:flex; align-items:center; gap:9px; padding:14px 16px 12px; border-bottom:1px solid var(--line); }
  header .logo-mark{ flex-shrink:0; display:block; }
  header h1{ font-size:14px; margin:0; font-weight:650; letter-spacing:-0.01em; }
  main{ padding:14px 16px 16px; }

  label{ display:block; font-size:12px; color:var(--text-2); margin:12px 0 6px; }
  input, select{
    width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--line-strong);
    color:var(--text); font-size:13px; border-radius:8px; font-family:inherit; transition:border-color .15s ease;
  }
  input:focus, select:focus{ outline:none; border-color:var(--accent-line); }
  select{ appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2381828a'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center;
  }

  button{
    width:100%; margin-top:10px; padding:9px 12px; border:1px solid transparent; border-radius:8px;
    font-weight:560; cursor:pointer; font-size:13px; font-family:inherit;
    transition:background-color .2s ease, border-color .2s ease, color .2s ease;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  button.primary{ background:var(--accent); color:var(--ink); }
  button.primary:hover:not(:disabled){ background:var(--accent-hover); }
  button.secondary{ background:var(--surface-2); border-color:var(--line-strong); color:var(--text); }
  button.secondary:hover:not(:disabled){ background:var(--surface-3); }
  button:disabled{ opacity:0.45; cursor:not-allowed; }
  button.loading .btn-label::after{
    content:""; width:12px; height:12px; margin-left:6px;
    border:2px solid rgba(5,20,13,0.3); border-top-color:var(--ink);
    border-radius:50%; display:inline-block; animation:pcr-spin .7s linear infinite; vertical-align:-2px;
  }
  button.secondary.loading .btn-label::after{ border-color:rgba(236,236,238,0.3); border-top-color:var(--text); }
  @keyframes pcr-spin{ to{ transform:rotate(360deg); } }

  .asin-box{ font-size:11.5px; color:var(--text-3); font-family:var(--mono); word-break:break-all; }

  #catalog-status{
    margin-top:8px; padding:9px 10px; border-radius:8px; font-size:12px; line-height:1.45;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-2);
  }
  #catalog-status:empty{ display:none; }
  #catalog-status.status-in{ border-color:var(--accent-line); background:var(--accent-soft); color:var(--text); }
  #catalog-status.status-out{ color:var(--text); }

  #preview{ margin-top:12px; display:none; border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--surface-2); }
  #preview img{ max-width:100%; max-height:120px; display:block; margin:0 auto 8px; background:#f4f4f5; border-radius:6px; }
  #preview .nom{ font-weight:600; font-size:13px; }
  #preview .prix{ font-family:var(--mono); font-size:14px; margin-top:4px; }

  #status{ margin-top:10px; font-size:12px; white-space:pre-wrap; min-height:14px; line-height:1.4; color:var(--text-2); }
  #status.is-error{ color:var(--danger); }
  #status.is-ok{ color:var(--accent); }

  .tip{ margin-top:12px; font-size:11.5px; color:var(--text-3); line-height:1.45; }

  details#settings{ margin-top:16px; border-top:1px solid var(--line); padding-top:10px; }
  details#settings summary{
    cursor:pointer; font-size:12px; color:var(--text-2); list-style:none; display:flex; align-items:center; gap:6px; user-select:none;
  }
  details#settings summary::-webkit-details-marker{ display:none; }
  details#settings summary::before{ content:"›"; font-size:14px; transition:transform .15s ease; }
  details#settings[open] summary::before{ transform:rotate(90deg); }

  #no-asin{ font-size:12.5px; color:var(--text-2); line-height:1.5; }
</style>
</head>
<body>
  <header>
    <svg class="logo-mark" width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="15" fill="#141517"/>
      <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#35363c" stroke-width="1.5"/>
      <g transform="translate(0 1.5)" fill="none" stroke="#ececee" stroke-width="7">
        <path d="M21 49V15h12.5a9.5 9.5 0 0 1 0 19H21"/><path d="M31.5 34 44.6 49"/>
      </g>
      <circle cx="50" cy="13" r="4.5" fill="#3ecf8e"/>
    </svg>
    <h1>PC Radar</h1>
  </header>

  <main>
    <div id="no-asin" style="display:none;">
      Ouvre une fiche produit Amazon pour l'ajouter au catalogue.
      <p class="tip">Sur une page de résultats, chaque produit affiche son état PC Radar, et la barre en bas à gauche permet d'ajouter une sélection ou de mettre à jour plusieurs prix d'un coup.</p>
    </div>

    <div id="main-ui">
      <div class="asin-box" id="asin-display"></div>
      <div id="catalog-status"></div>

      <label for="categorie-select">Catégorie</label>
      <select id="categorie-select">
        <option value="" id="categorie-auto-opt">Auto</option>
        <option value="CPU">CPU</option>
        <option value="Carte mère">Carte mère</option>
        <option value="RAM">RAM</option>
        <option value="Boîtier">Boîtier</option>
        <option value="Alimentation">Alimentation</option>
        <option value="GPU">GPU</option>
        <option value="Stockage">Stockage</option>
        <option value="Refroidissement">Refroidissement</option>
        <option value="Accessoire">Accessoire</option>
      </select>

      <button id="fetch-btn" class="primary"><span class="btn-label">Ajouter au catalogue</span></button>

      <div id="preview">
        <img id="preview-img" alt="">
        <div class="nom" id="preview-nom"></div>
        <div class="prix" id="preview-prix"></div>
        <button id="remove-btn" class="secondary"><span class="btn-label">Retirer</span></button>
      </div>

      <div id="status"></div>
    </div>

    <details id="settings">
      <summary>Réglages</summary>
      <label for="site-url">URL du site</label>
      <input type="text" id="site-url" placeholder="https://pcradar.tech">
      <label for="admin-secret">Mot de passe admin</label>
      <input type="password" id="admin-secret" placeholder="••••••••">
      <button id="save-settings-btn" class="secondary"><span class="btn-label">Enregistrer</span></button>
    </details>
  </main>

  <script src="categorize.js"></script>
  <script src="popup.js"></script>
</body>
</html>
