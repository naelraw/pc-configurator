<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0e0f11">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuration partagée — PC Radar</title>
<meta name="description" content="Découvrez cette configuration PC partagée sur PC Radar, avec vérification de compatibilité automatique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://m.media-amazon.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/static/favicon-96.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<script src="/static/pwa.js" defer></script>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/dialog.css">
<script src="/static/affiliate-tag.js"></script>
<script src="/static/csp-handlers.js"></script>
<script src="/static/dialog.js"></script>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="/" class="logo"><img src="/static/favicon.svg" alt="" width="22" height="22">PC Radar</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav>
      <ul>
        <li><a href="/">Accueil</a></li>
        <li><a href="/configurateur">Configurateur</a></li>
        <li><a href="/assistant">Assistant IA</a></li>
        <li><a href="/comparateur">Comparateur</a></li>
        <li><a href="/estimer-fps">Estimer FPS</a></li>
        <li><a href="/compte">Mon compte</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
<section id="build-view" style="padding-top:56px;">
  <div class="section-title" id="build-title-section">
    <h1 id="build-name">Chargement...</h1>
    <p id="build-date"></p>
  </div>

  <div id="build-content"></div>

  <div style="margin-top:32px;">
    <button class="btn btn-primary" id="reuse-btn" data-onclick="reuseBuild()" style="display:none;">Reprendre cette configuration dans le configurateur</button>
  </div>

  <div class="fps-picker hidden" id="fps-picker-box">
    <label for="fps-game-search">Estimer les FPS (jusqu'à 5 jeux à la fois)</label>
    <div class="search-box" id="fps-search-box">
      <input type="text" id="fps-game-search" placeholder="Rechercher un jeu (ex: Fortnite, Cyberpunk 2077...)" autocomplete="off">
      <div class="search-results" id="fps-game-results"></div>
    </div>
    <div id="fps-selected-game" class="fps-selected-game hidden"></div>
    <div class="fps-quality">
      <label for="fps-quality">Réglages graphiques</label>
      <select id="fps-quality">
        <option value="ultra">Ultra</option>
        <option value="eleve">Élevé</option>
        <option value="moyen">Moyen</option>
        <option value="bas">Bas / compétitif</option>
      </select>
    </div>
    <button class="btn btn-secondary use-config-btn" id="fps-estimate-btn" data-onclick="estimateFps()" disabled>Estimer les FPS de cette configuration</button>
  </div>
  <div id="fps-result" style="margin-top:20px;"></div>
</section>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <strong>PC Radar</strong>
      <span>Projet personnel et indépendant. Compatibilité vérifiée côté serveur, suggestions IA validées avant affichage.</span>
    </div>
    <div class="footer-legal-links">
      <a href="/mentions-legales">Mentions légales</a>
      <a href="/confidentialite">Confidentialité</a>
      <a href="/cgu">CGU</a>
      <a href="/cookies">Cookies</a>
    </div>
  </div>
</footer>

<script src="/static/pages/build-view.js"></script>

<script src="/static/nav-menu.js"></script>
<script src="/static/effects.js"></script>
<script src="/static/fps-render.js"></script>
<script src="/static/image-lightbox.js"></script>

</body>
</html>
