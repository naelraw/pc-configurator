# Rafraîchit automatiquement les prix Amazon (via Bright Data) une fois par
# mois — 5000 requêtes gratuites/mois, largement suffisant pour tout le
# catalogue en un seul passage.
name: Refresh Amazon Prices
on:
  schedule:
    - cron: "0 4 1 * *"  # le 1er de chaque mois à 4h UTC
  workflow_dispatch: {}   # permet aussi un déclenchement manuel depuis GitHub
jobs:
  refresh-prices:
    name: Refresh Amazon prices
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/admin/refresh-prices
        run: |
          curl -sS -X POST "https://pcradar.tech/api/admin/refresh-prices" \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SECRET }}" \
            --max-time 300 \
            --fail-with-body
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
